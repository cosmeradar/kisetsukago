name: daily

on:
  schedule:
    # 毎日 07:20 UTC（米国東部 夏時間 3:20 / 冬時間 2:20、日本時間 16:20）
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ページを組み立てる
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python3 scripts/build.py

      - name: 変更があれば公開する
        run: |
          git config user.name "kisetsukago-bot"
          git config user.email "301740245+cosmeradar@users.noreply.github.com"
          if git diff --quiet -- moushou/; then
            echo "内容に変化がないため、公開処理は行いません"
            exit 0
          fi
          git add moushou/
          git commit -m "猛暑ページを更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST)"
          git push
          echo "公開しました"
