name: daily

on:
  schedule:
    # 3:00 UTC＝日本時間の正午。GitHub の定時実行は数時間遅れることが多く（2026年10月は7時間前後、
    # いちばん遅い日は12時間）、遅れても日本時間の夜のうちに動くよう早めにしてある。
    # 日付が変わった直後に動いた日は、build.py が書き換えずに終わる（前の日のページが残る）。
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ページを組み立てる
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python3 scripts/build.py

      - name: 変更があれば公開する
        run: |
          git config user.name "kisetsukago-bot"
          git config user.email "contact@kisetsukago.com"
          # まだ一度も書き出されていないページがあっても止まらないよう、あるものだけ登録する
          for p in index.html sitemap.xml kion uryo fusoku shitsudo danbou koromogae; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "内容に変化がないため、公開処理は行いません"
            exit 0
          fi
          git commit -m "トップページと各ページを更新"
          git push
          echo "公開しました"
